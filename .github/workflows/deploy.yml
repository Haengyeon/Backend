name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 빌드가 꼬인다
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VM_HOST: 34.64.180.100
  VM_USER: sojeong

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 배포
        run: |
          # 스크립트를 stdin으로 넘기지 않는다. docker compose run이 stdin을 먹는다
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            'cd ~/app && git fetch origin main && git reset --hard origin/main && bash deploy/remote-deploy.sh' \
            < /dev/null

      - name: 상태 확인
        run: |
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            'docker compose -f ~/app/docker-compose.prod.yml ps'

      - name: 배포 검증
        run: |
          # 밖에서 실제로 응답하는지 본다. 안 되면 배포를 실패로 끝낸다
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              https://haengyeon.site/api/v1/health --max-time 10 || echo 000)
            if [ "$code" = "200" ]; then
              echo "health 200 - 배포 반영 확인"
              exit 0
            fi
            echo "  ($i/12) code=$code"
            sleep 5
          done
          echo "health 엔드포인트가 응답하지 않습니다"
          exit 1

      - name: 배포된 코드가 최신인지 확인
        run: |
          # 컨테이너가 실제로 교체됐는지 본다. health 200만으로는 옛 코드도 통과한다
          remote=$(ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            'docker inspect app-app-1 --format "{{.Image}}"')
          latest=$(ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" \
            'docker image inspect app-app:latest --format "{{.Id}}"')
          echo "실행 중: $remote"
          echo "최신:    $latest"
          if [ "$remote" != "$latest" ]; then
            echo "컨테이너가 최신 이미지로 교체되지 않았습니다"
            exit 1
          fi
          echo "최신 이미지로 실행 중"
