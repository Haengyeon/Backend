# 배포용. 로컬 개발은 docker-compose.yml을 쓴다.
# DB는 Cloud SQL, 인증샷은 GCS라 여기엔 app + caddy만 있다.

services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      PORT: 4000
      # refresh 쿠키가 secure + sameSite=none으로 나가려면 필요
      NODE_ENV: production
    # 새 컨테이너가 실제로 응답할 때까지 배포를 기다리게 한다
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # 파일 하나가 아니라 디렉터리를 건다. git이 파일을 갈아치워도 반영된다
      - ./deploy/caddy:/etc/caddy:ro
      # 인증서 보관. 지우면 재발급된다
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
